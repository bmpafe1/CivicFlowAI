<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Council assistant</title>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/common.js"></script>
</head>
<body data-portal="citizen" data-page="assistant">
<div id="shell"></div>
<main class="wrap">
  <div class="notice n-warn" id="relay" hidden style="margin-bottom:12px"></div>
  <div class="split">
    <section class="main card stack">
      <div class="row between">
        <div class="stack" style="gap:2px"><h1 style="font-size:22px" id="aTitle"></h1><span class="small muted" id="aSub"></span></div>
        <span class="badge b-warn" id="langBadge">English</span>
      </div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="chips" id="sugg"></div>
      <form id="f" class="row" style="flex-wrap:nowrap">
        <label class="sr" for="msg">Your message</label>
        <input id="msg" type="text" autocomplete="off" style="flex:1">
        <button type="button" class="btn gold" id="mic" aria-label="Send a voice note">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="btn" type="submit" id="send">Send</button>
      </form>
      <button class="btn ghost sm" id="human" style="align-self:center" data-i18n="common.staff"></button>
    </section>
    <aside class="side stack">
      <div class="card stack">
        <h3 id="kTitle"></h3>
        <p class="small muted" style="margin:0" id="kText"></p>
        <div class="small"><span class="badge b-ok">Knowledge base v2026.11</span> <span class="muted" id="kVer"></span></div>
      </div>
      <div class="card stack">
        <h3 id="gTitle"></h3>
        <ul class="small" style="margin:0;padding-left:18px" id="gList"></ul>
      </div>
      <div class="card stack">
        <h3 id="tTitle"></h3>
        <div class="chips" id="tryList"></div>
      </div>
    </aside>
  </div>
</main>
<script>
(function(){
  const A = App, chat = document.getElementById('chat');
  if (A.param('relay')) { const rb = document.getElementById('relay'); rb.hidden = false; rb.innerHTML = '<strong>Community relay mode.</strong> ' + A.esc(A.param('relay')) + ' is using the assistant on behalf of a resident without a phone. Consent recorded at ' + new Date().toTimeString().slice(0,5) + '. Updates are sent to the relay and read out to the resident.'; }
  const LNAME = { en: 'English', fr: 'Français', pcm: 'Pidgin' };
  const now = () => new Date().toTimeString().slice(0,5);
  function add(who, html, meta){ const d = document.createElement('div'); d.className = 'msg ' + who; d.innerHTML = html + (meta ? '<span class="meta">' + meta + '</span>' : ''); chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d; }
  function speak(text, lang){ try { const u = new SpeechSynthesisUtterance(text.replace(/\[|\]/g,'')); u.lang = lang === 'fr' ? 'fr-FR' : 'en-GB'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){ A.toast('Audio playback not available in this browser'); } }
  function reply(text, isVoice){
    const a = A.assistantAnswer(text);
    if (a.handover && !a.id) { A.state.kbGaps = A.state.kbGaps || []; A.state.kbGaps.push({ q: text, date: A.TODAY, lang: a.lang }); A.save(); }
    document.getElementById('langBadge').textContent = LNAME[a.lang];
    const typing = add('bot', '…');
    setTimeout(() => {
      typing.remove();
      let html = A.esc(a.text);
      if (a.fees) html += '<br><br>' + A.FEES.slice(0,6).map(f => '• ' + A.esc(A.state.lang==='fr'?f.fr:f.en) + ': ' + A.fmt(f.amount) + ' ' + f.unit).join('<br>');
      const d = add('bot', html, 'AI assistant · ' + now() + ' · answer drawn from the Limbe II knowledge base');
      const bar = document.createElement('div'); bar.className = 'row'; bar.style.marginTop = '8px';
      const play = document.createElement('button'); play.className = 'btn sm ghost'; play.textContent = '▶ ' + (a.lang==='fr'?'Écouter':'Listen'); play.onclick = () => speak(a.text, a.lang); bar.appendChild(play);
      if (a.action){ const l = document.createElement('a'); l.className = 'btn sm gold'; l.href = a.action[0]; l.textContent = a.lang==='fr'?a.action[2]:a.lang==='pcm'?a.action[3]:a.action[1]; bar.appendChild(l); }
      if (a.handover){ const hb = document.createElement('button'); hb.className = 'btn sm gold'; hb.textContent = a.lang==='fr'?'Oui, un agent':'Yes, connect me'; hb.onclick = handover; bar.appendChild(hb); }
      d.appendChild(bar);
      if (isVoice) speak(a.text, a.lang);
    }, 700);
  }
  function send(text, voice){ if (!text.trim()) return; add('me', A.esc(text), voice ? '🎤 Voice note · 0:09 · transcribed' : now()); reply(text, voice); }
  function handover(){ add('bot', A.state.lang==='fr' ? 'Conversation transmise à un agent de la commune. Vous serez rappelé(e) pendant les heures d’ouverture.' : 'Conversation passed to a council staff member (demo). You will get a call back during office hours. Reference: HO-2026-0412.', 'Hand-over · ' + now()); }
  document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); const m = document.getElementById('msg'); send(m.value); m.value = ''; });
  document.getElementById('human').addEventListener('click', handover);
  const VOICES = { late: 'Ma pikin don reach seven year, e no get birth certificate. Na exam e wan write. Wetin I go do?',
    birth: 'My pikin don born for Hillview Health Centre. Wetin I go do make e get birth certificate?',
    displaced: 'We run comot when fighting start, our house burn with all my papers. I need my birth certificate for exam registration.' };
  const VOICE = VOICES[A.param('voice')] || VOICES.late;
  document.getElementById('mic').addEventListener('click', () => {
    const b = document.getElementById('mic'); b.disabled = true; b.setAttribute('aria-label','Listening');
    const l = add('me', '🎤 ' + (A.state.lang==='fr'?'Écoute…':'Listening… (demo voice note)'));
    setTimeout(() => { l.remove(); b.disabled = false; send(VOICE, true); }, 1500);
  });
  function render(){
    const fr = A.state.lang === 'fr';
    document.getElementById('aTitle').textContent = fr ? 'Assistant de la commune' : 'Council assistant';
    document.getElementById('aSub').textContent = fr ? 'Répond uniquement à partir des informations vérifiées de ' + A.council().name : 'Answers only from ' + A.council().name + '’s verified information';
    document.getElementById('msg').placeholder = fr ? 'Écrivez en français, anglais ou pidgin…' : 'Type in English, French or Pidgin, or press the mic';
    document.getElementById('send').textContent = fr ? 'Envoyer' : 'Send';
    document.getElementById('kTitle').textContent = fr ? 'D’où viennent les réponses' : 'Where answers come from';
    document.getElementById('kText').textContent = fr ? 'Procédures, pièces, tarifs et horaires validés par le service d’état civil. Si l’information manque, l’assistant le dit et propose un agent.' : 'Procedures, documents, fees and opening hours approved by the civil status office. If something is not covered, the assistant says so and offers a staff member.';
    document.getElementById('kVer').textContent = fr ? 'vérifié le 10 nov. 2026' : 'last verified 10 Nov 2026';
    document.getElementById('gTitle').textContent = fr ? 'Règles de l’assistant' : 'What the assistant will not do';
    document.getElementById('gList').innerHTML = (fr ? ['Inventer un tarif ou une règle','Approuver ou refuser une demande','Partager vos données sans raison'] : ['Invent a fee or a rule','Approve or refuse a request: registrars decide','Share your personal data beyond what is needed']).map(x => '<li>' + x + '</li>').join('');
    document.getElementById('tTitle').textContent = fr ? 'Essayez' : 'Try asking';
    const tries = ['Ma pikin don reach seven year, e no get birth certificate. Wetin I go do?','A man said I must pay 10,000 for the jacket or he will seize my bike','J’ai perdu l’acte de naissance de mon fils pendant la crise','Where is my request LR-2026-00207?','How much is a certified copy?','What time does the office open?','How do I start a small shop?'];
    document.getElementById('tryList').innerHTML = tries.map(q => '<button class="chip" type="button">' + A.esc(q) + '</button>').join('');
    document.querySelectorAll('#tryList .chip').forEach(c => c.onclick = () => send(c.textContent));
    document.getElementById('sugg').innerHTML = (fr ? ['Déclarer une naissance','Copie perdue','Tarifs'] : ['Register a birth','Lost certificate','Fees','Rider jacket']).map(q => '<button class="chip" type="button">' + q + '</button>').join('');
    document.querySelectorAll('#sugg .chip').forEach(c => c.onclick = () => send(c.textContent));
  }
  render(); document.addEventListener('langchange', render);
  add('bot', A.esc(A.state.lang==='fr' ? 'Bonjour ! Je suis l’assistant de la commune. Posez votre question par écrit ou par la voix, en français, en anglais ou en pidgin.' : 'Hello! I’m the council assistant. Ask me anything about council services, by typing or by voice, in English, French or Pidgin.'), 'Council assistant');
  const q = A.param('q'); if (q) send(q);
  if (A.param('voice')) setTimeout(() => document.getElementById('mic').click(), 400);
})();
</script>
</body>
</html>
